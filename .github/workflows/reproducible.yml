# Proof that the Linux packages, the Windows installer and the macOS
# application are reproducible: each target is built twice, on two
# runners, in the same pinned image, and the run fails if a single byte
# of the .deb, the .rpm, the .AppImage, the setup .exe or the macOS zip
# differs. When it does fail, the diffoscope reports are attached to the
# run. The Windows installer is then installed, started and removed on a
# Windows runner, and the macOS application checked and started on an
# Apple silicon and an Intel Mac. release.yml runs the same jobs on every
# tag, and publishes nothing unless they pass. See
# docs/REPRODUCIBLE-BUILDS.md.
#
# The jobs live in reusable workflows: container-build.yml (one build),
# compare-builds.yml (the two builds of a target), smoke.yml (on
# Windows or a Mac) and apple-sdk.yml (the SDK the macOS build needs).
#
# Started by hand: Actions, Reproducible build, Run workflow. It builds
# the application twice from nothing, so it is not something to run on
# every push. `target` picks one platform: a macOS runner costs ten
# times a Linux one, and the other targets need none.

name: Reproducible build

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to build twice and test
        type: choice
        options: [all, linux, windows, macos]
        default: all
      macos-reference:
        description: >-
          macOS: also build the app on a Mac with Tauri's own bundler and
          compare the two bundles (half an hour of a macOS runner)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  linux-1:
    if: inputs.target == 'all' || inputs.target == 'linux'
    uses: ./.github/workflows/container-build.yml
    with:
      target: linux
      build: '1'
    secrets:
      core-deploy-key: ${{ secrets.CORE_DEPLOY_KEY }}

  linux-2:
    if: inputs.target == 'all' || inputs.target == 'linux'
    uses: ./.github/workflows/container-build.yml
    with:
      target: linux
      build: '2'
    secrets:
      core-deploy-key: ${{ secrets.CORE_DEPLOY_KEY }}

  linux-compare:
    needs: [linux-1, linux-2]
    uses: ./.github/workflows/compare-builds.yml
    with:
      target: linux

  windows-1:
    if: inputs.target == 'all' || inputs.target == 'windows'
    uses: ./.github/workflows/container-build.yml
    with:
      target: windows
      build: '1'
      accept-microsoft-license: true
    secrets:
      core-deploy-key: ${{ secrets.CORE_DEPLOY_KEY }}

  windows-2:
    if: inputs.target == 'all' || inputs.target == 'windows'
    uses: ./.github/workflows/container-build.yml
    with:
      target: windows
      build: '2'
      accept-microsoft-license: true
    secrets:
      core-deploy-key: ${{ secrets.CORE_DEPLOY_KEY }}

  windows-compare:
    needs: [windows-1, windows-2]
    uses: ./.github/workflows/compare-builds.yml
    with:
      target: windows

  windows-smoke:
    needs: windows-compare
    uses: ./.github/workflows/smoke.yml
    with:
      target: windows
      artifact: windows-1

  apple-sdk:
    if: inputs.target == 'all' || inputs.target == 'macos'
    uses: ./.github/workflows/apple-sdk.yml
    secrets:
      apple-sdk-cache-key: ${{ secrets.APPLE_SDK_CACHE_KEY }}

  macos-1:
    needs: apple-sdk
    if: inputs.target == 'all' || inputs.target == 'macos'
    uses: ./.github/workflows/container-build.yml
    with:
      target: macos
      build: '1'
      apple-sdk-key: ${{ needs.apple-sdk.outputs.key }}
    secrets:
      core-deploy-key: ${{ secrets.CORE_DEPLOY_KEY }}
      apple-sdk-cache-key: ${{ secrets.APPLE_SDK_CACHE_KEY }}

  macos-2:
    needs: apple-sdk
    if: inputs.target == 'all' || inputs.target == 'macos'
    uses: ./.github/workflows/container-build.yml
    with:
      target: macos
      build: '2'
      apple-sdk-key: ${{ needs.apple-sdk.outputs.key }}
    secrets:
      core-deploy-key: ${{ secrets.CORE_DEPLOY_KEY }}
      apple-sdk-cache-key: ${{ secrets.APPLE_SDK_CACHE_KEY }}

  macos-compare:
    needs: [macos-1, macos-2]
    uses: ./.github/workflows/compare-builds.yml
    with:
      target: macos

  macos-smoke:
    needs: macos-compare
    uses: ./.github/workflows/smoke.yml
    with:
      target: macos
      artifact: macos-1

  # Tauri's own bundle of the same commit, built on a Mac, next to the
  # one the recipe lays out on Linux. Only text leaves the runner: the
  # two Info.plist files, the two listings, the libraries each slice
  # loads and what it targets. Run it when Tauri is upgraded.
  macos-reference:
    needs: macos-compare
    if: inputs.macos-reference
    permissions:
      contents: read
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: gerfaut-desktop
          persist-credentials: false

      - name: Read the pinned gerfaut-core revision
        id: core
        run: echo "rev=$(cat gerfaut-desktop/.github/gerfaut-core.rev)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: gerfaut-wallet/gerfaut-core
          ref: ${{ steps.core.outputs.rev }}
          ssh-key: ${{ secrets.CORE_DEPLOY_KEY }}
          path: gerfaut-core
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        working-directory: gerfaut-desktop
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustc --version

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0

      # With the inputs of the build on Linux. The Xcode whose SDK the
      # recipe links against, where the runner defaults to an older one.
      # And no pkg-config: the runner's Homebrew has an xz, and liblzma-sys
      # would link the Apple silicon half against that copy, a library
      # no user has, where the recipe builds liblzma into the program.
      - name: Build with Tauri's bundler
        working-directory: gerfaut-desktop
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.1.1.app/Contents/Developer
          PKG_CONFIG: /usr/bin/false
        run: |
          xcrun --show-sdk-version
          npm ci
          npm run tauri -- build --ci --target universal-apple-darwin --bundles app -- --locked

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-1
          path: artefact

      - name: Compare the two bundles
        run: |
          set -euo pipefail
          native=gerfaut-desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/Gerfaut.app
          ditto -x -k artefact/*_universal.zip cross
          cross=cross/Gerfaut.app
          mkdir reference
          listing() { (cd "$1" && find . -print0 | LC_ALL=C sort -z | xargs -0 stat -f '%Sp %N'); }
          failed=""
          cp "$native/Contents/Info.plist" reference/native-Info.plist
          cp "$cross/Contents/Info.plist" reference/cross-Info.plist
          cmp reference/native-Info.plist reference/cross-Info.plist || failed="$failed Info.plist"
          cmp "$native/Contents/Resources/icon.icns" "$cross/Contents/Resources/icon.icns" || failed="$failed icon"
          listing "$native" > reference/native-listing.txt
          listing "$cross" > reference/cross-listing.txt
          # The one difference by design: Tauri signs nothing without an
          # identity, the recipe signs ad hoc.
          grep -v '/_CodeSignature' reference/cross-listing.txt > cross-unsigned.txt
          cmp reference/native-listing.txt cross-unsigned.txt || failed="$failed listing"
          grep -qx 'drwxr-xr-x ./Contents/_CodeSignature' reference/cross-listing.txt || failed="$failed signature"
          grep -qx -- '-rw-r--r-- ./Contents/_CodeSignature/CodeResources' reference/cross-listing.txt || failed="$failed signature"
          # Each half against its native twin: the same libraries, the
          # same oldest macOS, the same SDK. The libraries are compared as
          # sets, since the two linkers list them in their own order. The
          # rest is only printed: each linker names itself and its version
          # in LC_BUILD_VERSION, Apple's writes an LC_SOURCE_VERSION of 0
          # that lld leaves out, and Tauri leaves the Intel half unsigned
          # where the recipe signs both.
          for arch in arm64 x86_64; do
            for side in native cross; do
              if [ "$side" = native ]; then app="$native"; else app="$cross"; fi
              binary="$app/Contents/MacOS/gerfaut-desktop"
              otool -arch "$arch" -L "$binary" | tail -n +2 | LC_ALL=C sort > "reference/$side-$arch-libraries.txt"
              otool -arch "$arch" -l "$binary" > "$side-$arch-commands.txt"
              awk '$1 == "cmd" { cmd = $2; if (cmd ~ /^LC_(BUILD_VERSION|VERSION_MIN_MACOSX)$/) print $1, $2 }
                cmd == "LC_BUILD_VERSION" && $1 ~ /^(minos|sdk)$/ { print $1, $2 }
                cmd == "LC_VERSION_MIN_MACOSX" && $1 ~ /^(version|sdk)$/ { print $1, $2 }' \
                "$side-$arch-commands.txt" > "reference/$side-$arch-build-version.txt"
              awk '$1 == "cmd" { print $2 }' "$side-$arch-commands.txt" | LC_ALL=C sort | uniq -c \
                > "reference/$side-$arch-load-commands.txt"
            done
            cmp "reference/native-$arch-libraries.txt" "reference/cross-$arch-libraries.txt" || failed="$failed $arch-libraries"
            cmp "reference/native-$arch-build-version.txt" "reference/cross-$arch-build-version.txt" || failed="$failed $arch-build-version"
            diff "reference/native-$arch-load-commands.txt" "reference/cross-$arch-load-commands.txt" || true
          done
          # The Intel half targets the macOS Info.plist declares. Apple
          # silicon starts at 11.0, whatever the plist says.
          minimum="$(plutil -extract LSMinimumSystemVersion raw "$cross/Contents/Info.plist")"
          grep -qx "version $minimum" reference/cross-x86_64-build-version.txt || failed="$failed x86_64-minimum"
          grep -qx "minos 11.0" reference/cross-arm64-build-version.txt || failed="$failed arm64-minimum"
          # What Tauri's bundler writes when told to sign ad hoc, beside
          # what rcodesign wrote, and what Apple's checks make of each.
          codesign --force --sign - --options runtime "$native"
          codesign -dv --verbose=4 "$native" > reference/native-adhoc-signature.txt 2>&1
          codesign -dv --verbose=4 "$cross" > reference/cross-signature.txt 2>&1
          syspolicy_check distribution "$native" > reference/native-syspolicy.txt 2>&1 || true
          syspolicy_check distribution "$cross" > reference/cross-syspolicy.txt 2>&1 || true
          for file in reference/*; do echo "== $file"; cat "$file"; echo; done
          [ -z "$failed" ] || { echo "the bundles differ:$failed"; exit 1; }
          echo "same Info.plist, icon, layout, libraries and targets"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: macos-reference
          if-no-files-found: warn
          path: reference/

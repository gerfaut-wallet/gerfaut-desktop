# Builds every file of a release on each `v*` tag, the way
# docs/REPRODUCIBLE-BUILDS.md tells anyone to rebuild them, and attaches
# them to a draft GitHub Release: review it, sign it with
# scripts/sign-release.ps1, then click Publish.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Each target is built twice, on two runners, in the pinned container of
# reproducible/ (container-build.yml), and the two builds are compared
# byte for byte (compare-builds.yml). The Windows installer and the macOS
# application are installed or unpacked and started on the systems they
# are for (smoke.yml). Nothing is drafted unless all of it passed: what
# ships was built twice with the same bytes, and was seen running.
#
# A manual run (Actions, Release, Run workflow) is the dress rehearsal:
# the same jobs, and the files of the release as a workflow artifact,
# gerfaut-desktop-release. It touches no tag and no release.
#
# The split of privileges holds throughout. Every build, comparison and
# test runs with a read-only token. The token that can write to the
# repository exists only in the last job, `draft`, which runs `gh` on
# the files handed over and nothing else: no checkout, no build tool, no
# third-party code.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-1:
    uses: ./.github/workflows/container-build.yml
    with:
      target: linux
      build: '1'
    secrets:
      core-deploy-key: ${{ secrets.CORE_DEPLOY_KEY }}

  linux-2:
    uses: ./.github/workflows/container-build.yml
    with:
      target: linux
      build: '2'
    secrets:
      core-deploy-key: ${{ secrets.CORE_DEPLOY_KEY }}

  linux-compare:
    needs: [linux-1, linux-2]
    uses: ./.github/workflows/compare-builds.yml
    with:
      target: linux

  windows-1:
    uses: ./.github/workflows/container-build.yml
    with:
      target: windows
      build: '1'
      accept-microsoft-license: true
    secrets:
      core-deploy-key: ${{ secrets.CORE_DEPLOY_KEY }}

  windows-2:
    uses: ./.github/workflows/container-build.yml
    with:
      target: windows
      build: '2'
      accept-microsoft-license: true
    secrets:
      core-deploy-key: ${{ secrets.CORE_DEPLOY_KEY }}

  windows-compare:
    needs: [windows-1, windows-2]
    uses: ./.github/workflows/compare-builds.yml
    with:
      target: windows

  windows-smoke:
    needs: windows-compare
    uses: ./.github/workflows/smoke.yml
    with:
      target: windows
      artifact: windows-1

  apple-sdk:
    uses: ./.github/workflows/apple-sdk.yml

  macos-1:
    needs: apple-sdk
    uses: ./.github/workflows/container-build.yml
    with:
      target: macos
      build: '1'
      apple-sdk-key: ${{ needs.apple-sdk.outputs.key }}
    secrets:
      core-deploy-key: ${{ secrets.CORE_DEPLOY_KEY }}

  macos-2:
    needs: apple-sdk
    uses: ./.github/workflows/container-build.yml
    with:
      target: macos
      build: '2'
      apple-sdk-key: ${{ needs.apple-sdk.outputs.key }}
    secrets:
      core-deploy-key: ${{ secrets.CORE_DEPLOY_KEY }}

  macos-compare:
    needs: [macos-1, macos-2]
    uses: ./.github/workflows/compare-builds.yml
    with:
      target: macos

  macos-smoke:
    needs: macos-compare
    uses: ./.github/workflows/smoke.yml
    with:
      target: macos
      artifact: macos-1

  # The gate. Both builds of every target gave the same files with the
  # same bytes, both come from this commit and the pinned core, and the
  # set is exactly the five files of a release, named after the version
  # the tag carries. The release is gathered here, with its SHA256SUMS,
  # still with a read-only token.
  assemble:
    needs: [linux-compare, windows-compare, macos-compare, windows-smoke, macos-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: '*-[12]'
          path: builds

      - name: Check both builds and gather the release
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          mkdir release
          : > sums
          for target in linux windows macos; do
            one="builds/$target-1" two="builds/$target-2"
            [ -s "$one/SHA256SUMS" ] && [ -s "$two/SHA256SUMS" ] || { echo "::error::$target: a build is missing"; exit 1; }
            cmp "$one/SHA256SUMS" "$two/SHA256SUMS" || { echo "::error::$target: the two builds differ"; exit 1; }
            (cd "$one" && sha256sum --check --strict SHA256SUMS)
            (cd "$two" && sha256sum --check --strict SHA256SUMS)
            for build in "$one" "$two"; do
              grep -qx "gerfaut-desktop $GITHUB_SHA" "$build/build-info/sources" \
                || { echo "::error::$build was not built from $GITHUB_SHA"; exit 1; }
              ! grep -q 'NOT A RELEASE BUILD' "$build/build-info/sources" \
                || { echo "::error::$build was built against a core other than the pinned one"; exit 1; }
            done
            cat "$one/SHA256SUMS" >> sums
          done
          version="$(sed -n 's/^[0-9a-f]\{64\}  Gerfaut_\([0-9]*\.[0-9]*\.[0-9]*\)_x64-setup\.exe$/\1/p' sums)"
          [ -n "$version" ] || { echo "::error::no installer named after a version"; exit 1; }
          expected="$(printf '%s\n' "Gerfaut-$version-1.x86_64.rpm" "Gerfaut_${version}_amd64.AppImage" \
            "Gerfaut_${version}_amd64.deb" "Gerfaut_${version}_universal.zip" "Gerfaut_${version}_x64-setup.exe")"
          have="$(awk '{ print $2 }' sums | LC_ALL=C sort)"
          [ "$have" = "$expected" ] || { echo "::error::not the files of a release: $have"; exit 1; }
          if [ "$REF_TYPE" = tag ]; then
            [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "::error::the tag $GITHUB_REF_NAME does not name version $version"; exit 1; }
          fi
          while read -r _ name; do
            cp "builds/$(case "$name" in *.exe) echo windows ;; *.zip) echo macos ;; *) echo linux ;; esac)-1/$name" release/
          done < sums
          LC_ALL=C sort -k2 sums > release/SHA256SUMS
          (cd release && sha256sum --check --strict SHA256SUMS)
          [ "$(find release -type f | wc -l)" -eq 6 ]
          cat release/SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gerfaut-desktop-release
          if-no-files-found: error
          path: release/

  # The only job that can write to the repository, and it runs nothing
  # but `gh` on the files the gate handed over. Only on a pushed tag: a
  # manual run, even from a tag, stops at the artifact.
  draft:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: gerfaut-desktop-release
          path: release

      # Five files and their SHA256SUMS, or nothing: a draft missing a
      # platform would be signed and published as if it were complete.
      - name: Check the files
        run: |
          set -euo pipefail
          [ "$(find release -type f | wc -l)" -eq 6 ] || { echo "::error::expected five files and SHA256SUMS"; exit 1; }
          (cd release && sha256sum --check --strict SHA256SUMS)

      # `--verify-tag` refuses to invent a tag. A draft that already
      # exists (a re-run) gets its assets replaced; a published release
      # is never touched, `gh release create` fails on it.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: |
            ### Downloads

            - **Linux**: `Gerfaut_@VERSION@_amd64.AppImage` (any distribution: `chmod +x`, then run it), `Gerfaut_@VERSION@_amd64.deb` (Debian, Ubuntu) or `Gerfaut-@VERSION@-1.x86_64.rpm` (Fedora)
            - **Windows**: `Gerfaut_@VERSION@_x64-setup.exe`
            - **macOS**: `Gerfaut_@VERSION@_universal.zip`, for Apple silicon and Intel: unzip it, then move Gerfaut to Applications

            These builds carry no certificate from Microsoft or Apple, so both
            systems hold them at arm's length on a first launch. Windows shows a
            SmartScreen notice: click "More info", then "Run anyway". macOS
            refuses the app the first time: open System Settings, then Privacy &
            Security, and click "Open Anyway", which appears there after the
            refusal. Since macOS Sequoia, right-click and Open no longer gets past
            it. Check the hashes below before you do either.

            ### Verify your download (optional)

            `SHA256SUMS` lists the hash of every file above and is signed with the author's [minisign](https://jedisct1.github.io/minisign/) key:

            ```
            RWTz3c4gUmglCX5Uvjthigz1ts3TS3ZSdhRNpFgOJRW/Wr4XjGlqTR3O
            ```

            Download `SHA256SUMS` and `SHA256SUMS.minisig` next to your file, then:

            1. The signature proves the hash list comes from the author:
               `minisign -Vm SHA256SUMS -P RWTz3c4gUmglCX5Uvjthigz1ts3TS3ZSdhRNpFgOJRW/Wr4XjGlqTR3O`
            2. The hashes prove your file was not altered:
               - Linux: `sha256sum --check SHA256SUMS --ignore-missing`
               - macOS: `shasum -a 256 --check SHA256SUMS --ignore-missing`
               - Windows: `(Get-FileHash .\<file>).Hash` must match the file's line in `SHA256SUMS`

            ### Rebuild it yourself

            Every file above was built from this tag in the pinned Linux container
            of `reproducible/`, twice, on two machines, with the same bytes both
            times. You can rebuild any of them on your own Linux machine and
            compare them byte for byte with the files of this release:

            ```
            git clone https://github.com/gerfaut-wallet/gerfaut-desktop
            gerfaut-desktop/reproducible/verify.sh @TAG@
            ```

            Add `--target windows --accept-microsoft-license` for the Windows
            installer, or `--target macos --macos-sdk <dir>` for the macOS app.
            [REPRODUCIBLE-BUILDS.md](https://github.com/gerfaut-wallet/gerfaut-desktop/blob/@TAG@/docs/REPRODUCIBLE-BUILDS.md)
            explains each step, and what you download yourself.
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::not a release tag: $GITHUB_REF_NAME"; exit 1; }
          notes="${NOTES//@TAG@/$GITHUB_REF_NAME}"
          notes="${notes//@VERSION@/${GITHUB_REF_NAME#v}}"
          mapfile -t files < <(find release -type f | LC_ALL=C sort)
          if [ "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" = true ]; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag \
              --title "Gerfaut $GITHUB_REF_NAME" \
              --notes "$notes" \
              "${files[@]}"
          fi

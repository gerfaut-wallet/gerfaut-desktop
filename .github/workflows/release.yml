# Builds native installers for Windows, macOS and Linux on every `v*` tag
# and attaches them to a draft GitHub Release (review, sign with
# scripts/sign-release.ps1, then click Publish).
# Manual runs build the same installers and upload them as workflow
# artifacts only.
#
# Two jobs, on purpose. The build runs code this repository does not
# control (the Tauri CLI, npm packages, the linuxdeploy tools the AppImage
# bundler fetches) and holds nothing but a read-only token while it does.
# The token that can write to the repository exists only in the last job,
# which runs `gh` on the files the build handed over and nothing else.
#
#   git tag v0.1.0 && git push origin v0.1.0

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Runner images are named, never `-latest`: those labels move to
          # a new OS on GitHub's schedule, and two tags of the same app
          # must not be built against a different SDK by surprise.
          - platform: macos-15            # .dmg + .app (universal: Apple Silicon + Intel)
            args: --target universal-apple-darwin
          # The oldest image still maintained, on purpose: packages built
          # against its glibc 2.35 run on the distributions released since,
          # and packages built on a newer one do not run here.
          - platform: ubuntu-22.04        # .AppImage + .deb + .rpm
            args: ''
          - platform: windows-2025        # NSIS setup.exe + .msi
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      # No credentials left in .git/config: nothing after a checkout talks
      # to GitHub, and a token cached on disk would outlive the step that
      # needed it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: gerfaut-desktop
          persist-credentials: false

      # The Tauri crate depends on the sibling gerfaut-core checkout, and
      # a path dependency records no revision: without this pin, a tag
      # would build against whatever `main` happened to be that minute,
      # and re-running it a week later would ship different code under
      # the same version. Bump the file before tagging.
      - name: Read the pinned gerfaut-core revision
        id: core
        run: echo "rev=$(cat gerfaut-desktop/.github/gerfaut-core.rev)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: gerfaut-wallet/gerfaut-core
          ref: ${{ steps.core.outputs.rev }}
          ssh-key: ${{ secrets.CORE_DEPLOY_KEY }}
          path: gerfaut-core
          persist-credentials: false

      # The same list README.md gives, so a contributor on a bare system
      # installs what CI installs. webkit2gtk is the webview and pulls GTK
      # in with it, librsvg turns the icon into the one the desktop entry
      # points at, patchelf and wget are how the AppImage bundler rewrites
      # the rpath and fetches linuxdeploy, and libdbus is what the
      # credential store talks to. The built-in Tor adds nothing here:
      # arti is rustls throughout and links its own SQLite.
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config curl wget file libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev xdg-utils

      # rust-toolchain.toml names the compiler and rustup installs what
      # it names. No step here picks a version of its own.
      - name: Install the pinned Rust toolchain
        working-directory: gerfaut-desktop
        run: |
          rustup toolchain install
          rustc --version

      - name: Add the Apple targets
        if: matrix.platform == 'macos-15'
        working-directory: gerfaut-desktop
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: gerfaut-desktop/src-tauri

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0

      - name: Install frontend dependencies
        working-directory: gerfaut-desktop
        run: npm ci

      # The AppImage bundler fetches five helper tools from references
      # that move (release assets that can be re-uploaded, a `master`
      # branch, a `continuous` release), verifies none of them, runs three
      # of them here and ships AppRun and the gtk hook inside the AppImage
      # itself. It does skip a download when the file already sits in its
      # cache, so the files are fetched here first and checked against the
      # hashes committed in .github/linuxdeploy.sha256 before the bundler
      # sees them. The check has to come before the build: the bundler
      # overwrites three bytes of linuxdeploy once it has it.
      - name: Stage the linuxdeploy tools and check their hashes
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          tools="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          mkdir -p "$tools"
          cd "$tools"
          fetch() { curl --fail --silent --show-error --location --retry 3 --output "$1" "$2"; }
          fetch AppRun-x86_64 https://github.com/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-x86_64
          fetch linuxdeploy-x86_64.AppImage https://github.com/tauri-apps/binary-releases/releases/download/linuxdeploy/linuxdeploy-x86_64.AppImage
          fetch linuxdeploy-plugin-gtk.sh https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          fetch linuxdeploy-plugin-gstreamer.sh https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gstreamer/master/linuxdeploy-plugin-gstreamer.sh
          fetch linuxdeploy-plugin-appimage.AppImage https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          sha256sum --check --strict "$GITHUB_WORKSPACE/gerfaut-desktop/.github/linuxdeploy.sha256"
          # The bundler only marks executable what it downloads itself.
          chmod +x AppRun-x86_64 linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk.sh linuxdeploy-plugin-gstreamer.sh linuxdeploy-plugin-appimage.AppImage

      # Build only: with no tag name the action leaves the tag space and
      # the releases page alone, and it is given no token to touch them
      # with.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # action-v0.6.2
        with:
          projectPath: gerfaut-desktop
          args: ${{ matrix.args }}

      # The installers leave the runner as a workflow artifact: what a
      # manual run is for, and what the draft job below picks up on a
      # tag. `error` on no match is the point, since these paths are the
      # only thing tying this step to where Tauri writes. The
      # `.app.tar.gz` Tauri also writes on macOS is the updater's archive,
      # and Gerfaut has no updater, so it stays behind.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gerfaut-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            gerfaut-desktop/src-tauri/target/release/bundle/**/*.AppImage
            gerfaut-desktop/src-tauri/target/release/bundle/**/*.deb
            gerfaut-desktop/src-tauri/target/release/bundle/**/*.rpm
            gerfaut-desktop/src-tauri/target/release/bundle/**/*.exe
            gerfaut-desktop/src-tauri/target/release/bundle/**/*.msi
            gerfaut-desktop/src-tauri/target/universal-apple-darwin/release/bundle/**/*.dmg

  # The only job that can write to the repository, and it runs nothing
  # but `gh` on the files the build produced: no checkout, no build tool,
  # no third-party code.
  draft:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: installers
          merge-multiple: true

      # One installer of each kind, or nothing: a draft missing a platform
      # would be signed and published as if it were complete.
      - name: Check the set of installers
        run: |
          find installers -type f | sort
          for ext in exe msi dmg AppImage deb rpm; do
            n=$(find installers -type f -name "*.$ext" | wc -l)
            [ "$n" -eq 1 ] || { echo "expected one .$ext, found $n" >&2; exit 1; }
          done

      # `--verify-tag` refuses to invent a tag. A draft that already exists
      # (a re-run) gets its assets replaced; a published release is never
      # touched, `gh release create` fails on it.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: |
            ### Downloads
            - **Windows**: `*-setup.exe` (installer) or `.msi`
            - **macOS**: `.dmg`
            - **Linux**: `.AppImage` (portable, `chmod +x` then run), `.deb` or `.rpm`

            These builds carry no code-signing certificate, so both systems
            hold them at arm's length on a first launch. Windows shows a
            SmartScreen notice: "More info", then "Run anyway". macOS refuses
            outright, and you allow it once in System Settings, under Privacy
            & Security, with the "Open Anyway" button that appears there after
            the refusal. Check the hashes below before you do either.

            ### Verify your download (optional)
            `SHA256SUMS` lists the hash of every file above and is signed with the author's [minisign](https://jedisct1.github.io/minisign/) key:

            ```
            RWTz3c4gUmglCX5Uvjthigz1ts3TS3ZSdhRNpFgOJRW/Wr4XjGlqTR3O
            ```

            Download `SHA256SUMS` and `SHA256SUMS.minisig` next to your installer, then:

            1. The signature proves the hash list comes from the author:
               `minisign -Vm SHA256SUMS -P RWTz3c4gUmglCX5Uvjthigz1ts3TS3ZSdhRNpFgOJRW/Wr4XjGlqTR3O`
            2. The hashes prove your file was not altered:
               - Linux: `sha256sum --check SHA256SUMS --ignore-missing`
               - macOS: `shasum -a 256 --check SHA256SUMS --ignore-missing`
               - Windows: `(Get-FileHash .\<file>).Hash` must match the file's line in `SHA256SUMS`
        run: |
          mapfile -t files < <(find installers -type f | sort)
          if [ "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" = true ]; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag \
              --title "Gerfaut $GITHUB_REF_NAME" \
              --notes "$NOTES" \
              "${files[@]}"
          fi

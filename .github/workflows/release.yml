# Builds native installers for Windows, macOS and Linux on every `v*` tag,
# and attaches them to a draft GitHub Release (review, sign with
# scripts/sign-release.ps1, then click Publish).
# Manual runs build the same installers and upload them as workflow
# artifacts only.
#
#   git tag v0.1.0 && git push origin v0.1.0

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Runner images are named, never `-latest`: those labels move to
          # a new OS on GitHub's schedule, and two tags of the same app
          # must not be built against a different SDK by surprise.
          - platform: macos-15            # .dmg + .app (universal: Apple Silicon + Intel)
            args: --target universal-apple-darwin
          # The oldest image still maintained, on purpose: packages built
          # against its glibc 2.35 run on the distributions released since,
          # and packages built on a newer one do not run here.
          - platform: ubuntu-22.04        # .AppImage + .deb + .rpm
            args: ''
          - platform: windows-2025        # NSIS setup.exe + .msi
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          path: gerfaut-desktop

      # The Tauri crate depends on the sibling gerfaut-core checkout.
      - uses: actions/checkout@v4
        with:
          repository: gerfaut-wallet/gerfaut-core
          ssh-key: ${{ secrets.CORE_DEPLOY_KEY }}
          path: gerfaut-core

      # webkit2gtk is the webview and pulls GTK in with it, librsvg turns
      # the icon into the one the desktop entry points at, patchelf is how
      # the AppImage bundler rewrites the binary's rpath, and libdbus is
      # what the credential store talks to. The built-in Tor adds nothing
      # to this list: arti is rustls throughout and links its own SQLite.
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev

      # rust-toolchain.toml names the compiler and rustup installs what
      # it names. No step here picks a version of its own.
      - name: Install the pinned Rust toolchain
        working-directory: gerfaut-desktop
        run: |
          rustup toolchain install
          rustc --version

      - name: Add the Apple targets
        if: matrix.platform == 'macos-15'
        working-directory: gerfaut-desktop
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gerfaut-desktop/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Install frontend dependencies
        working-directory: gerfaut-desktop
        run: npm ci

      # A tag names a release and the action creates it. A manual run
      # leaves those inputs empty, and the action then builds and stops:
      # the tag space and the releases page stay untouched.
      - uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: gerfaut-desktop
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Gerfaut {0}', github.ref_name) || '' }}
          releaseBody: |
            ### Downloads
            - **Windows**: `*-setup.exe` (installer) or `.msi`
            - **macOS**: `.dmg` (unsigned build: on first launch, right-click the app then choose Open)
            - **Linux**: `.AppImage` (portable, `chmod +x` then run), `.deb` or `.rpm`

            ### Verify your download (optional)
            `SHA256SUMS` lists the hash of every file above and is signed with the author's [minisign](https://jedisct1.github.io/minisign/) key:

            ```
            RWTz3c4gUmglCX5Uvjthigz1ts3TS3ZSdhRNpFgOJRW/Wr4XjGlqTR3O
            ```

            Download `SHA256SUMS` and `SHA256SUMS.minisig` next to your installer, then:

            1. The signature proves the hash list comes from the author:
               `minisign -Vm SHA256SUMS -P RWTz3c4gUmglCX5Uvjthigz1ts3TS3ZSdhRNpFgOJRW/Wr4XjGlqTR3O`
            2. The hashes prove your file was not altered:
               - Linux: `sha256sum --check SHA256SUMS --ignore-missing`
               - macOS: `shasum -a 256 --check SHA256SUMS --ignore-missing`
               - Windows: `(Get-FileHash .\<file>).Hash` must match the file's line in `SHA256SUMS`
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # What a manual run is for: an installer to hand someone, attached
      # to the run itself. `error` on no match is the point, since these
      # paths are the only thing tying this step to where Tauri writes.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: gerfaut-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            gerfaut-desktop/src-tauri/target/release/bundle/**/*.AppImage
            gerfaut-desktop/src-tauri/target/release/bundle/**/*.deb
            gerfaut-desktop/src-tauri/target/release/bundle/**/*.rpm
            gerfaut-desktop/src-tauri/target/release/bundle/**/*.exe
            gerfaut-desktop/src-tauri/target/release/bundle/**/*.msi
            gerfaut-desktop/src-tauri/target/universal-apple-darwin/release/bundle/**/*.dmg

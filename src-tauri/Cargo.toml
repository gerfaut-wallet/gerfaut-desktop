[package]
name = "gerfaut-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Gerfaut for Windows, macOS, and Linux, a Bitcoin watch-only wallet"
repository = "https://github.com/gerfaut-wallet/gerfaut-desktop"
license = "AGPL-3.0-only"
publish = false

[lib]
name = "gerfaut_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
gerfaut-core = { path = "../../gerfaut-core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native-sync-persistent", "crypto-rust"] }
rand = "0.9"
hex = "0.4"

[package]
name = "gerfaut-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Gerfaut for Windows, macOS, and Linux, a Bitcoin watch-only wallet"
repository = "https://github.com/gerfaut-wallet/gerfaut-desktop"
license = "AGPL-3.0-only"
publish = false

[lib]
name = "gerfaut_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The built-in Tor client: a .onion backend must not require the user to
# install Tor first.
gerfaut-core = { path = "../../gerfaut-core", features = ["embedded-tor"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native-sync-persistent", "crypto-rust"] }
rand = "0.9"
hex = "0.4"
data-encoding = "2"

# The library the notification plugin posts with, called directly on
# Linux: the plugin drops a notification's id on the desktop, and the id
# is what lets a confirmation take the place of its pending notice.
[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4.11"

# The toast API, called directly on Windows for the same reason: a
# toast replaces another only when both carry a tag and a group, and the
# plugin sets neither. The version the plugin's toast library uses.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Data_Xml_Dom", "Foundation_Collections", "UI_Notifications"] }

[dev-dependencies]
# The tests sign the licences they then read back; the app itself never
# signs anything.
ed25519-dalek = "2"
# A vault of their own for the tests that open one.
tempfile = "3"

# Cargo only honours [patch] in the root manifest: the same pin as in
# gerfaut-core, see the note there.
[patch.crates-io]
saturating-time = { git = "https://github.com/gerfaut-wallet/saturating-time", rev = "7bef6ba00f3adaa6aff7e68966614c9d55bb60ec" }
